# Loads every colorscheme and lualine theme in a clean Neovim, on every push to
# main and every pull request (scripts/check.lua). Both the latest release and
# nightly, since a colorscheme breaks on highlight API changes first.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  load:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.version }}
      - run: nvim --headless -u NONE -l scripts/check.lua
